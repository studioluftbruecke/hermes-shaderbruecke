name: shaderbruecke
version: "0.2.5"
description: "Make, check, tune and export GLSL shaders with your Hermes agent: a headless Chromium renders every frame, Desktop plays them live with sliders, and every export carries a proof."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - shader_render
  - shader_library
  - shader_export
provides_hooks:
  - pre_llm_call
config_schema:
  allow_project_writes:
    type: boolean
    default: false
    label: "Project writes in unattended runs"
    description: "Allow shader_export and share to write into dest_dir during unattended runs (cron, webhook, single query)."
  credit_line:
    type: boolean
    default: true
    label: "Credit line in exports"
    description: "Append the 'Made with Shaderbrücke' line to every export header."
  keep_versions:
    type: int
    default: 5
    label: "Versions with frames"
    description: "Keep frames and proof images for the newest N versions of each shader; older versions keep their source, record and export files."
  author_name:
    type: string
    default: ""
    label: "Author name"
    description: "Your name as it appears in export headers and share files (empty: none)."
  author_url:
    type: string
    default: ""
    label: "Author link"
    description: "A link that goes with your name in export headers and share files (http:// or https://)."
  starter_prompt:
    type: boolean
    default: true
    label: "Example prompt in new chats"
    description: "Start new shader chats from the Shaderbrücke page with one of the example prompts."
